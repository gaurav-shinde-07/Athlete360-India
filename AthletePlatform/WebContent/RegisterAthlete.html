<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Athlete Registration</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root {
            --primary: #0056b3;
            --secondary: #003366;
            --accent: #ff6b00;
            --light: #f8f9fa;
            --dark: #212529;
            --gray: #6c757d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .registration-card {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 500px;
            margin: 20px;
        }

        .registration-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .registration-header h1 {
            color: var(--secondary);
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .input-group {
            margin-bottom: 25px;
        }

        .input-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .input-label {
            display: block;
            margin-bottom: 8px;
            color: var(--secondary);
            font-weight: 500;
        }

        .input-field {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .input-field:focus {
            border-color: var(--primary);
            outline: none;
        }

        .gender-group {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .gender-option {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            background-color: var(--secondary);
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
        }

        .login-link a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
        }

        .login-link a:hover {
            text-decoration: underline;
        }
        
          .back-button {
            position: absolute;
            top: 30px;
            left: 30px;
            color: white;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
            transition: opacity 0.3s ease;
        }

        .back-button i {
            font-size: 1.2rem;
        }

        .back-button:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

      <a href="athleteLogin.html" class="back-button">
        <i class="fas fa-chevron-left"></i>
        Back to Home
    </a>
    
    <div class="registration-card">
        <div class="registration-header">
            <h1>Athlete Registration</h1>
            <p>Create your athlete profile</p>
        </div>

        <form>
            <div class="input-row">
                <div class="input-group">
                    <label class="input-label">Full Name</label>
                    <input type="text" class="input-field" placeholder="John Doe" required>
                </div>

                <div class="input-group">
                    <label class="input-label">Date of Birth</label>
                    <input type="date" class="input-field" required>
                </div>
            </div>

            <div class="input-group">
                <label class="input-label">Gender</label>
                <div class="gender-group">
                    <label class="gender-option">
                        <input type="radio" name="gender" value="male" required>
                        Male
                    </label>
                    <label class="gender-option">
                        <input type="radio" name="gender" value="female">
                        Female
                    </label>
                    <label class="gender-option">
                        <input type="radio" name="gender" value="other">
                        Other
                    </label>
                </div>
            </div>

            <div class="input-row">
                <div class="input-group">
                    <label class="input-label">Phone Number</label>
                    <input type="tel" class="input-field" placeholder="+1 555 123 4567" required>
                </div>

                <div class="input-group">
                    <label class="input-label">Email</label>
                    <input type="email" class="input-field" placeholder="athlete@example.com" required>
                </div>
            </div>

            <div class="input-row">
                <div class="input-group">
                    <label class="input-label">Height (cm)</label>
                    <input type="number" class="input-field" placeholder="180" min="100" max="250" required>
                </div>

                <div class="input-group">
                    <label class="input-label">Weight (kg)</label>
                    <input type="number" class="input-field" placeholder="75" min="30" max="200" required>
                </div>
            </div>

            <div class="input-group">
                <label class="input-label">Professional Debut Year</label>
                <input type="number" class="input-field" placeholder="2018" 
                       min="1900" max="2024" required>
            </div>

            <div class="input-group">
                <label class="input-label">Password</label>
                <input type="password" class="input-field" placeholder="••••••••" 
                       pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}" 
                       title="Must contain at least 8 characters, including uppercase and lowercase letters, and numbers" 
                       required>
            </div>

            <button type="submit" class="btn-primary">Register</button>

            <div class="login-link">
                <p>Already have an account? <a href="athleteLogin.html">Login here</a></p>
            </div>
        </form>
    </div>
</body>
</html>
